<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
      color: #f8fafc;
      padding: 20px;
    }

    .game-card {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 24px;
      padding: 36px 28px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 16px 24px;
      margin: 24px 0;
    }

    .score-box {
      flex: 1;
    }

    .score-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #94a3b8;
      margin-bottom: 6px;
    }

    .score-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 28px 0;
    }

    .choice-btn {
      flex: 1;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 18px;
      padding: 20px 10px;
      color: #f8fafc;
      cursor: pointer;
      transition: transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }

    .choice-btn:hover:not(:disabled) {
      transform: translateY(-5px);
      background: rgba(255, 255, 255, 0.16);
      box-shadow: 0 12px 24px rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
    }

    .choice-btn:active:not(:disabled) {
      transform: scale(0.96);
    }

    .choice-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .emoji {
      display: block;
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .result-box {
      min-height: 68px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(15, 23, 42, 0.45);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 1.05rem;
      color: #e2e8f0;
    }

    .reset-btn {
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      border: none;
      border-radius: 12px;
      padding: 12px 28px;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .reset-btn:hover {
      opacity: 0.92;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <main class="game-card">
    <h1 style="font-size: 1.85rem; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 6px;">
      Rock · Paper · Scissors
    </h1>
    <p id="round-indicator" style="color: #94a3b8; font-size: 0.95rem;">
      Best of 3 Rounds — Make your move!
    </p>

    <div class="scoreboard">
      <div class="score-box">
        <div class="score-label">You</div>
        <div id="human-score" class="score-value">0</div>
      </div>

      <div style="font-size: 1rem; font-weight: 700; color: #64748b; padding: 0 12px;">
        VS
      </div>

      <div class="score-box">
        <div class="score-label">Computer</div>
        <div id="computer-score" class="score-value" style="color: #f472b6;">0</div>
      </div>
    </div>

    <div class="choices">
      <button id="rock-btn" class="choice-btn" type="button">
        <span class="emoji">🪨</span>
        <span style="font-weight: 600; font-size: 0.95rem;">Rock</span>
      </button>

      <button id="paper-btn" class="choice-btn" type="button">
        <span class="emoji">📄</span>
        <span style="font-weight: 600; font-size: 0.95rem;">Paper</span>
      </button>

      <button id="scissors-btn" class="choice-btn" type="button">
        <span class="emoji">✂️</span>
        <span style="font-weight: 600; font-size: 0.95rem;">Scissors</span>
      </button>
    </div>

    <div id="result-box" class="result-box">
      <span style="color: #94a3b8; font-size: 0.95rem;">Choose an option above to start Round 1</span>
    </div>

    <button id="reset-btn" class="reset-btn" type="button" style="display: none;">
      Play Again
    </button>
  </main>

  <script src="script.js"></script>
</body>
</html>
